# ============================================================
# Railway — Configuração de Deploy (NestJS Backend)
# ============================================================
# Referência: https://docs.railway.app/reference/config-as-code
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/main"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
